name: Test catalog tools

on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/manual-app-update.yml'
      - '.github/workflows/test-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
