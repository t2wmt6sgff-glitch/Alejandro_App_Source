name: Audit custom iOS build feasibility

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which official project to build without signing
        required: true
        type: choice
        options:
          - Manic EMU
          - Gen1Recomp

permissions:
  contents: read

jobs:
  manic:
    if: inputs.target == 'Manic EMU'
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - name: Check out official sideload source
        run: |
          git clone --depth 1 --branch v2.0.2 --recurse-submodules https://github.com/Manic-EMU/ManicEMU.git "$RUNNER_TEMP/ManicEMU"
          cd "$RUNNER_TEMP/ManicEMU"
          git lfs install
          git lfs pull
          echo "UPSTREAM_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Resolve official Xcode packages
        run: |
          cd "$RUNNER_TEMP/ManicEMU"
          xcodebuild -resolvePackageDependencies \
            -project ManicEmu/ManicEmu.xcodeproj \
            -scheme ManicEmuSideload
      - name: Approve the pinned R.swift build plug-in for CI
        run: |
          # R.swift documents this exact CI setting so Xcode can fingerprint its plug-in without an interactive prompt.
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
      - name: Build unsigned iPad/iPhone app
        run: |
          cd "$RUNNER_TEMP/ManicEMU"
          xcodebuild \
            -project ManicEmu/ManicEmu.xcodeproj \
            -scheme ManicEmuSideload \
            -configuration SideloadRelease \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ManicDerived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGN_ENTITLEMENTS= \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            APP_BUNDLE_IDENTIFIER=com.aoshuang.manicemu \
            APP_VERSION=2.0.2 \
            APP_BUILD_VERSION=5
          app="$RUNNER_TEMP/ManicDerived/Build/Products/SideloadRelease-iphoneos/ManicEmuSideload.app"
          test -d "$app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist"
          test -d "$app/PlugIns/JITEnabler.appex"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/PlugIns/JITEnabler.appex/Info.plist"
          echo "Built Manic EMU v2.0.2 from $UPSTREAM_COMMIT without signing. This does not establish Feather signing or device installation."

  gen1recomp:
    if: inputs.target == 'Gen1Recomp'
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - name: Check out official source
        run: |
          git clone --depth 1 --branch v0.4.1 https://github.com/bryanthaboi/gen1recomp.git "$RUNNER_TEMP/gen1recomp"
          cd "$RUNNER_TEMP/gen1recomp"
          echo "UPSTREAM_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Fetch the upstream LÖVE/iOS dependencies
        run: |
          cd "$RUNNER_TEMP/gen1recomp"
          scripts/build_ios.sh --fetch
      - name: Make upstream no-sign test explicit
        run: |
          cd "$RUNNER_TEMP/gen1recomp"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/build_ios.sh")
          text = path.read_text()
          old = 'args+=(DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM"\n             CODE_SIGN_STYLE=Automatic\n             -allowProvisioningUpdates)'
          new = 'args+=(DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM"\n             CODE_SIGN_STYLE=Automatic\n             CODE_SIGNING_ALLOWED=NO\n             CODE_SIGNING_REQUIRED=NO\n             CODE_SIGN_IDENTITY=\n             -allowProvisioningUpdates)'
          if old not in text:
              raise SystemExit("Expected upstream signing argument block changed; refusing to patch")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Build with optional HealthKit capability disabled
        env:
          DEVELOPMENT_TEAM: 0000000000
          GEN1_DISABLE_HEALTHKIT: "1"
          GEN1_BUNDLE_ID: com.theboisclub.gen1recompplusplus
        run: |
          cd "$RUNNER_TEMP/gen1recomp"
          scripts/build_ios.sh --device --release --ipa --version 0.4.1
          app="$RUNNER_TEMP/gen1recomp/dist/ios/Release-iphoneos/gen1recomp++.app"
          test -d "$app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist"
          ipa="$RUNNER_TEMP/gen1recomp/dist/ios/gen1recomp++.ipa"
          test -s "$ipa"
          unzip -tq "$ipa"
          ipa_dir="$(mktemp -d)"
          trap 'rm -rf "$ipa_dir"' EXIT
          unzip -q "$ipa" -d "$ipa_dir"
          ipa_app="$ipa_dir/Payload/gen1recomp++.app"
          test -d "$ipa_app"
          python3 - "$ipa_app" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          app = Path(sys.argv[1])
          info = plistlib.loads((app / "Info.plist").read_bytes())
          assert info.get("CFBundleIdentifier") == "com.theboisclub.gen1recompplusplus", info.get("CFBundleIdentifier")
          assert info.get("CFBundleShortVersionString") == "0.4.1", info.get("CFBundleShortVersionString")
          print("IPA bundle:", info["CFBundleIdentifier"])
          print("IPA version/build:", info.get("CFBundleShortVersionString"), info.get("CFBundleVersion"))
          print("IPA minimum iOS:", info.get("MinimumOSVersion"))
          privacy = sorted(k for k in info if k.endswith("UsageDescription"))
          print("IPA privacy UsageDescription keys:", ", ".join(privacy) if privacy else "(none)")
          bundles = [app, *app.rglob("*.appex")]
          ids = []
          for bundle in bundles:
              p = plistlib.loads((bundle / "Info.plist").read_bytes())
              bid = p.get("CFBundleIdentifier")
              if bid:
                  ids.append(bid)
          assert len(ids) == len(set(ids)), f"duplicate app/extension identifiers: {ids}"
          assert all(x == ids[0] or x.startswith(ids[0] + ".") for x in ids), ids
          for entitlements in app.rglob("archived-expanded-entitlements.xcent"):
              ent = plistlib.loads(entitlements.read_bytes())
              assert "com.apple.developer.healthkit" not in ent, "HealthKit entitlement remains in IPA"
          print("IPA extension bundle IDs:", ", ".join(ids[1:]) if len(ids) > 1 else "(none)")
          print("IPA structure and bundle identifiers valid; HealthKit entitlement absent.")
          PY
          if /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.healthkit' "$app/archived-expanded-entitlements.xcent" 2>/dev/null; then
            echo 'HealthKit entitlement unexpectedly remains' >&2
            exit 1
          fi
          echo "Built Gen1Recomp v0.4.1 from $UPSTREAM_COMMIT without signing, using the upstream GEN1_DISABLE_HEALTHKIT option. The Pokéwalker step bridge remains compiled; it will not work without HealthKit. No app/game data is distributed."
