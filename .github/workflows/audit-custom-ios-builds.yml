name: Audit custom iOS build feasibility

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which official project to build without signing
        required: true
        type: choice
        options:
          - Manic EMU
          - Gen1Recomp

permissions:
  contents: read

jobs:
  manic:
    if: inputs.target == 'Manic EMU'
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - name: Check out official sideload source
        run: |
          git clone --depth 1 --branch v2.0.2 --recurse-submodules https://github.com/Manic-EMU/ManicEMU.git "$RUNNER_TEMP/ManicEMU"
          cd "$RUNNER_TEMP/ManicEMU"
          git lfs install
          git lfs pull
          echo "UPSTREAM_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Resolve official Xcode packages
        run: |
          cd "$RUNNER_TEMP/ManicEMU"
          xcodebuild -resolvePackageDependencies \
            -project ManicEmu/ManicEmu.xcodeproj \
            -scheme ManicEmuSideload \
            -derivedDataPath "$RUNNER_TEMP/ManicDerived" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/ManicPackages"
      - name: Prepare a pinned R.swift CLI generator
        run: |
          package="$RUNNER_TEMP/ManicPackages/checkouts/R.swift"
          resolved="$(find "$RUNNER_TEMP/ManicEMU/ManicEmu/ManicEmu.xcodeproj" -name Package.resolved -print -quit)"
          test -d "$package"
          test -s "$resolved"
          cp "$resolved" "$package/Package.resolved"
          swift build --package-path "$package" --product rswift --configuration release
          rswift="$package/.build/release/rswift"
          test -x "$rswift"
          echo "RSWIFT_BIN=$rswift" >> "$GITHUB_ENV"
      - name: Replace the unapproved build plugin in the temporary project
        run: |
          python3 - "$RUNNER_TEMP/ManicEMU/ManicEmu/ManicEmu.xcodeproj/project.pbxproj" "$RUNNER_TEMP/ManicEMU/ManicEmu/R.generated.swift" <<'PY'
          import re
          import sys
          from pathlib import Path

          project = Path(sys.argv[1])
          generated = Path(sys.argv[2])
          text = project.read_text()
          plugin_dependency = "57909381303C7D9100A53656"
          source_phase = "57909384303C7D9100A53656"
          target = "57909380303C7D9100A53656"
          build_file = "A1A1A1A1A1A1A1A1A1A1A1A1"
          file_ref = "B2B2B2B2B2B2B2B2B2B2B2B2"
          script_phase = "C3C3C3C3C3C3C3C3C3C3C3C3"
          if any(identifier in text for identifier in (build_file, file_ref, script_phase)):
              raise SystemExit("Temporary R.swift project identifiers already exist")
          target_start = text.index(f"{target} /* ManicEmuSideload */ = {{")
          target_end = text.index("\n\t\t};", target_start) + len("\n\t\t};")
          target_block = text[target_start:target_end]
          dependency_line = f"\t\t\t\t{plugin_dependency} /* PBXTargetDependency */,\n"
          if target_block.count(dependency_line) != 1:
              raise SystemExit("Expected exactly one R.swift plug-in dependency in ManicEmuSideload")
          target_block = target_block.replace(dependency_line, "", 1)
          phases_marker = "buildPhases = (\n"
          if target_block.count(phases_marker) != 1:
              raise SystemExit("Could not locate ManicEmuSideload build phases")
          target_block = target_block.replace(phases_marker, phases_marker + f"\t\t\t\t{script_phase} /* Generate R.swift resources */,\n", 1)
          text = text[:target_start] + target_block + text[target_end:]
          dependency_object = re.compile(
              rf"\n\t\t{plugin_dependency} /\* PBXTargetDependency \*/ = \{{.*?\n\t\t\}};\n", re.S
          )
          text, removed = dependency_object.subn("\n", text, count=1)
          if removed != 1:
              raise SystemExit("Could not remove the temporary R.swift plug-in target dependency")
          build_file_entry = f"\t\t{build_file} /* R.generated.swift in Sources */ = {{isa = PBXBuildFile; fileRef = {file_ref} /* R.generated.swift */; }};\n"
          text = text.replace("/* Begin PBXBuildFile section */\n", "/* Begin PBXBuildFile section */\n" + build_file_entry, 1)
          file_ref_entry = f"\t\t{file_ref} /* R.generated.swift */ = {{isa = PBXFileReference; lastKnownFileType = sourcecode.swift; name = R.generated.swift; path = \"{generated}\"; sourceTree = \"<absolute>\"; }};\n"
          text = text.replace("/* Begin PBXFileReference section */\n", "/* Begin PBXFileReference section */\n" + file_ref_entry, 1)
          source_re = re.compile(rf"({source_phase} /\* Sources \*/ = \{{.*?files = \(\n)", re.S)
          text, count = source_re.subn(rf"\1\t\t\t\t{build_file} /* R.generated.swift in Sources */,\n", text, count=1)
          if count != 1:
              raise SystemExit("Could not add generated R.swift to the sideload source phase")
          script = (
              "/* Begin PBXShellScriptBuildPhase section */\n"
              f"\t\t{script_phase} /* Generate R.swift resources */ = {{\n"
              "\t\t\tisa = PBXShellScriptBuildPhase;\n"
              "\t\t\tbuildActionMask = 2147483647;\n"
              "\t\t\tfiles = (\n\t\t\t);\n"
              "\t\t\tinputPaths = (\n\t\t\t);\n"
              "\t\t\tname = \"Generate R.swift resources\";\n"
              "\t\t\toutputPaths = (\n\t\t\t\t\"$(SRCROOT)/R.generated.swift\",\n\t\t\t);\n"
              "\t\t\trunOnlyForDeploymentPostprocessing = 0;\n"
              "\t\t\tshellPath = /bin/sh;\n"
              "\t\t\tshellScript = \"\\\"$RSWIFT_BIN\\\" generate \\\"$SRCROOT/R.generated.swift\\\"\\n\";\n"
              "\t\t\tshowEnvVarsInLog = 0;\n"
              "\t\t};\n"
              "/* End PBXShellScriptBuildPhase section */"
          )
          if "/* Begin PBXShellScriptBuildPhase section */" not in text:
              raise SystemExit("Could not locate Xcode shell script build phases")
          text = text.replace("/* Begin PBXShellScriptBuildPhase section */", script, 1)
          project.write_text(text)
          print("Temporary project now runs the pinned R.swift CLI before compiling resources; the Xcode plug-in is not invoked.")
          PY
      - name: Build unsigned iPad/iPhone app
        run: |
          cd "$RUNNER_TEMP/ManicEMU"
          xcodebuild \
            -project ManicEmu/ManicEmu.xcodeproj \
            -scheme ManicEmuSideload \
            -configuration SideloadRelease \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ManicDerived" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/ManicPackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGN_ENTITLEMENTS= \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            APP_BUNDLE_IDENTIFIER=com.aoshuang.manicemu \
            APP_VERSION=2.0.2 \
            APP_BUILD_VERSION=5
          app="$RUNNER_TEMP/ManicDerived/Build/Products/SideloadRelease-iphoneos/ManicEmuSideload.app"
          test -d "$app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist"
          test -d "$app/PlugIns/JITEnabler.appex"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/PlugIns/JITEnabler.appex/Info.plist"
          echo "Built Manic EMU v2.0.2 from $UPSTREAM_COMMIT without signing. This does not establish Feather signing or device installation."

  gen1recomp:
    if: inputs.target == 'Gen1Recomp'
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - name: Check out official source
        run: |
          git clone --depth 1 --branch v0.4.1 https://github.com/bryanthaboi/gen1recomp.git "$RUNNER_TEMP/gen1recomp"
          cd "$RUNNER_TEMP/gen1recomp"
          echo "UPSTREAM_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Fetch the upstream LÖVE/iOS dependencies
        run: |
          cd "$RUNNER_TEMP/gen1recomp"
          scripts/build_ios.sh --fetch
      - name: Make upstream no-sign test explicit
        run: |
          cd "$RUNNER_TEMP/gen1recomp"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/build_ios.sh")
          text = path.read_text()
          old = 'args+=(DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM"\n             CODE_SIGN_STYLE=Automatic\n             -allowProvisioningUpdates)'
          new = 'args+=(DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM"\n             CODE_SIGN_STYLE=Automatic\n             CODE_SIGNING_ALLOWED=NO\n             CODE_SIGNING_REQUIRED=NO\n             CODE_SIGN_IDENTITY=\n             -allowProvisioningUpdates)'
          if old not in text:
              raise SystemExit("Expected upstream signing argument block changed; refusing to patch")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Build with optional HealthKit capability disabled
        env:
          DEVELOPMENT_TEAM: 0000000000
          GEN1_DISABLE_HEALTHKIT: "1"
          GEN1_BUNDLE_ID: com.theboisclub.gen1recompplusplus
        run: |
          cd "$RUNNER_TEMP/gen1recomp"
          scripts/build_ios.sh --device --release --ipa --version 0.4.1
          app="$RUNNER_TEMP/gen1recomp/dist/ios/Release-iphoneos/gen1recomp++.app"
          test -d "$app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist"
          ipa="$RUNNER_TEMP/gen1recomp/dist/ios/gen1recomp++.ipa"
          test -s "$ipa"
          unzip -tq "$ipa"
          ipa_dir="$(mktemp -d)"
          trap 'rm -rf "$ipa_dir"' EXIT
          unzip -q "$ipa" -d "$ipa_dir"
          ipa_app="$ipa_dir/Payload/gen1recomp++.app"
          test -d "$ipa_app"
          python3 - "$ipa_app" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          app = Path(sys.argv[1])
          info = plistlib.loads((app / "Info.plist").read_bytes())
          assert info.get("CFBundleIdentifier") == "com.theboisclub.gen1recompplusplus", info.get("CFBundleIdentifier")
          assert info.get("CFBundleShortVersionString") == "0.4.1", info.get("CFBundleShortVersionString")
          print("IPA bundle:", info["CFBundleIdentifier"])
          print("IPA version/build:", info.get("CFBundleShortVersionString"), info.get("CFBundleVersion"))
          print("IPA minimum iOS:", info.get("MinimumOSVersion"))
          privacy = sorted(k for k in info if k.endswith("UsageDescription"))
          print("IPA privacy UsageDescription keys:", ", ".join(privacy) if privacy else "(none)")
          bundles = [app, *app.rglob("*.appex")]
          ids = []
          for bundle in bundles:
              p = plistlib.loads((bundle / "Info.plist").read_bytes())
              bid = p.get("CFBundleIdentifier")
              if bid:
                  ids.append(bid)
          assert len(ids) == len(set(ids)), f"duplicate app/extension identifiers: {ids}"
          assert all(x == ids[0] or x.startswith(ids[0] + ".") for x in ids), ids
          for entitlements in app.rglob("archived-expanded-entitlements.xcent"):
              ent = plistlib.loads(entitlements.read_bytes())
              assert "com.apple.developer.healthkit" not in ent, "HealthKit entitlement remains in IPA"
          print("IPA extension bundle IDs:", ", ".join(ids[1:]) if len(ids) > 1 else "(none)")
          print("IPA structure and bundle identifiers valid; HealthKit entitlement absent.")
          PY
          if /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.healthkit' "$app/archived-expanded-entitlements.xcent" 2>/dev/null; then
            echo 'HealthKit entitlement unexpectedly remains' >&2
            exit 1
          fi
          echo "Built Gen1Recomp v0.4.1 from $UPSTREAM_COMMIT without signing, using the upstream GEN1_DISABLE_HEALTHKIT option. The Pokéwalker step bridge remains compiled; it will not work without HealthKit. No app/game data is distributed."
